[package]
name = "echomonitor"
version = "0.1.0"
edition = "2021"
description = "Self-hosted distributed mesh monitoring: one static binary, zero target-host dependencies"
license = "MIT"
repository = "https://github.com/ech0burnin/echomonitor"
readme = "README.md"
keywords = ["monitoring", "mesh", "self-hosted", "network"]
categories = ["command-line-utilities", "network-management"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
nix = { version = "0.29", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.7"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
